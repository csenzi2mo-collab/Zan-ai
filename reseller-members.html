<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Reseller — ZanAI</title><style>
:root{--bg:url("https://i.postimg.cc/52rkqT5j/3806b2512197244d61631641f2acfee8.jpg");--bgc:#070a11;--card:rgba(14,19,30,.78);--card2:rgba(20,27,41,.9);--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:#98a4b6;--accent:#7c8cff;--accent2:#9b78ff;--good:#45d483;--bad:#ff7189;--warn:#f6bd4d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bgc)}body{background-image:linear-gradient(180deg,rgba(4,7,13,.68),rgba(4,7,13,.94)),var(--bg);background-size:cover;background-position:center;background-attachment:fixed}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{min-height:100vh;padding-bottom:84px}.topbar{max-width:1180px;margin:auto;padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:850;font-size:22px;letter-spacing:-.03em}.brand span{color:#a8b1ff}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.content{max-width:1180px;margin:auto;padding:10px 20px 30px}.title{font-size:clamp(28px,5vw,42px);letter-spacing:-.04em;margin:8px 0}.sub{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(18px);box-shadow:0 18px 70px rgba(0,0,0,.2)}.card h2,.card h3{margin:0 0 8px}.stat b{display:block;font-size:27px;margin-top:7px}.label{font-size:11px;color:var(--muted);letter-spacing:.08em}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);border-radius:13px;padding:11px 14px;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}.btn.danger{color:#ffc8d1;background:rgba(255,113,137,.09)}.btn:disabled{opacity:.5;cursor:not-allowed}.input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:13px;padding:12px 13px;outline:none}.input:focus,select:focus,textarea:focus{border-color:rgba(124,140,255,.65)}textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:flex;gap:5px;padding:7px;background:rgba(8,11,18,.86);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(20px);z-index:50;box-shadow:0 15px 45px rgba(0,0,0,.35)}.nav a{flex:1;min-width:0;text-align:center;color:#9da8ba;padding:9px 6px;border-radius:12px;font-size:11px}.nav a.active{background:rgba(124,140,255,.14);color:#fff}.ico{width:19px;height:19px;display:block;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:600}.chat{height:calc(100vh - 300px);min-height:360px;overflow:auto;display:grid;align-content:start;gap:12px;padding:4px}.msg{max-width:82%;padding:12px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap}.msg.user{justify-self:end;background:rgba(124,140,255,.17)}.msg.ai{background:rgba(255,255,255,.05);border:1px solid var(--line)}.composer{display:flex;gap:9px;align-items:end}.composer textarea{min-height:52px;max-height:130px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:rgba(7,10,17,.86);border:1px solid var(--line);border-radius:24px;padding:28px;backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.4)}.logo{font-size:32px;font-weight:900;letter-spacing:-.05em}.error{color:#ff9aaa;font-size:13px}.success{color:#70e8a5;font-size:13px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}.qr{width:min(300px,70vw);aspect-ratio:1;background:#fff;border-radius:18px;display:grid;place-items:center;color:#111;margin:auto}.qrbox{padding:20px;background:#fff;border-radius:15px;display:grid;gap:5px;grid-template-columns:repeat(11,1fr);width:190px}.qrbox i{aspect-ratio:1;background:#111}.qrbox i:nth-child(3n){background:transparent}.hidden{display:none!important}@media(max-width:850px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}@media(max-width:560px){.topbar,.content{padding-left:14px;padding-right:14px}.card{padding:16px;border-radius:17px}.g3{grid-template-columns:1fr}.g4{gap:10px}.stat b{font-size:23px}.nav{bottom:9px}.nav a{font-size:10px}.nav .optional{display:none}.composer{align-items:stretch}.composer .btn{padding-inline:12px}}
</style>
<script>window.ZAN_BACKEND=true;window.ZAN_API_BASE="";window.ZAN_LOCAL={get:(k,d)=>{try{const v=localStorage.getItem("zanai_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem("zanai_"+k,JSON.stringify(v)),addHist:()=>{}};</script>
<script>
if(window.ZAN_BACKEND){ /* backend mode: skip browser-local API mock */ } else {
(function(){
  const S='zanai_';
  const get=(k,d)=>{try{const v=localStorage.getItem(S+k);return v===null?d:JSON.parse(v)}catch(e){return d}};
  const set=(k,v)=>localStorage.setItem(S+k,JSON.stringify(v));
  const now=()=>new Date().toISOString();
  const uid=()=>Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
  const mask=k=>k?String(k).slice(0,4)+'••••••'+String(k).slice(-4):'••••';
  const hours=h=>new Date(Date.now()+Math.max(1,Number(h)||1)*3600000).toISOString();
  function seed(){
    if(!localStorage.getItem(S+'keys')) set('keys',[]);
    if(!localStorage.getItem(S+'orders')) set('orders',[]);
    if(!localStorage.getItem(S+'history')) set('history',[]);
    if(!localStorage.getItem(S+'prices')) set('prices',{FREE:0,PRO:0,VIP:0});
    if(!localStorage.getItem(S+'settings')) set('settings',{deepseekBase:'https://api.deepseek.com',deepseekApiKey:'',model:'deepseek-chat'});
  }
  seed();
  function current(){
    return get('currentUser',null);
  }
  function resp(data,status=200){
    return Promise.resolve(new Response(JSON.stringify(data),{
      status,headers:{'Content-Type':'application/json'}
    }));
  }
  function bodyOf(opts){
    try{return opts&&opts.body?JSON.parse(opts.body):{}}catch(e){return {}}
  }
  function makeKey(role,duration,owner){
    let key='ZAN-'+role+'-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
    const item={id:uid(),access_key:key,access_key_masked:mask(key),role:String(role||'FREE').toUpperCase(),status:'ACTIVE',
      expires_at:hours(duration),created_at:now(),owner_id:owner||'admin'};
    const a=get('keys',[]);a.unshift(item);set('keys',a);
    return item;
  }
  function userFromKey(key){
    const a=get('keys',[]); const x=a.find(v=>v.access_key===key && v.status!=='REVOKED');
    if(!x) return null;
    if(new Date(x.expires_at)<=new Date()){x.status='EXPIRED';set('keys',a);return null}
    return {id:x.id,role:x.role,status:x.status,access_key:x.access_key,access_key_masked:x.access_key_masked,expires_at:x.expires_at};
  }
  function addHist(title,message,userId){
    const a=get('history',[]);a.unshift({id:uid(),title,type:title,message,created_at:now(),user_id:userId||current()?.id||null});set('history',a);
  }
  function localAI(message){
    const p=String(message||'').trim();
    const lower=p.toLowerCase();
    let answer;
    if(!p) answer='Silakan tulis pertanyaan atau ide kamu.';
    else if(/harga|pricing|jual|jualan/.test(lower)) answer='Untuk ide bisnis, mulai dari target pelanggan, masalah yang ingin diselesaikan, nilai produk, harga, dan cara mendapatkan pelanggan. Saya bisa bantu membuat rencana yang lebih spesifik.';
    else if(/marketing|pemasaran|promosi/.test(lower)) answer='Mulai dengan menentukan target pasar, penawaran utama, kanal promosi, konten, dan ukuran keberhasilan. Buat satu eksperimen kecil lalu ukur hasilnya.';
    else if(/bisnis|usaha|startup/.test(lower)) answer='Ide bisnis yang baik biasanya berangkat dari masalah nyata. Tentukan siapa penggunanya, masalahnya, solusi, cara menghasilkan uang, dan keunggulan dibanding pilihan yang sudah ada.';
    else answer='Saya siap membantu menganalisis ide, menyusun strategi, membuat rencana bisnis, menghitung skenario, dan merapikan konsep kamu. Untuk jawaban AI penuh, masukkan API key DeepSeek di Setelan Admin.';
    return answer;
  }
  const nativeFetch=window.fetch.bind(window);
  window.fetch=function(input,opts){
    const url=typeof input==='string'?input:(input&&input.url)||'';
    const u=new URL(url,location.href), path=u.pathname;
    const method=((opts&&opts.method)||'GET').toUpperCase();
    const b=bodyOf(opts);
    // QRIS/order endpoints remain external by design. Without a backend/provider,
    // return a clear local response instead of producing "Failed to fetch".
    if(path.startsWith('/api/orders')){
      return resp({error:{message:'Fitur QRIS membutuhkan API key dan backend/provider pembayaran.'}},503);
    }
    // Local admin auth
    if(path==='/api/admin/auth/login' && method==='POST'){
      if(b.username==='zanai' && b.password==='zanai'){
        sessionStorage.setItem('zanai_admin_authenticated','1');
        set('adminSession',{username:'zanai',role:'ADMIN'});
        return resp({success:true,user:{username:'zanai',role:'ADMIN'}});
      }
      return resp({error:{message:'Username atau password salah'}},401);
    }
    if(path==='/api/admin/auth/logout'){
      sessionStorage.removeItem('zanai_admin_authenticated'); localStorage.removeItem(S+'adminSession');
      return resp({success:true});
    }
    if(path==='/api/auth/logout'){
      sessionStorage.removeItem('zan_session'); sessionStorage.removeItem('zanai_user_authenticated'); localStorage.removeItem(S+'currentUser');
      return resp({success:true});
    }
    if(path==='/api/auth/login' && method==='POST'){
      const user=userFromKey(b.accessKey);
      if(!user) return resp({error:{message:'Access key tidak valid atau sudah kedaluwarsa'}},401);
      set('currentUser',user);
      sessionStorage.setItem('zan_session',JSON.stringify({role:user.role}));
      sessionStorage.setItem('zanai_user_authenticated','1');
      addHist('Login','Login berhasil',user.id);
      return resp({success:true,user});
    }
    if(path==='/api/auth/me'){
      const u=current();
      if(!u) return resp({error:{message:'Belum masuk'}},401);
      const a=get('keys',[]), k=a.find(x=>x.id===u.id);
      if(!k || k.status==='REVOKED' || new Date(k.expires_at)<=new Date()){
        localStorage.removeItem(S+'currentUser'); return resp({error:{message:'Akun tidak aktif'}},401);
      }
      u.status=k.status;u.role=k.role;u.expires_at=k.expires_at;u.access_key=k.access_key;u.access_key_masked=k.access_key_masked;set('currentUser',u);
      return resp({success:true,user:u,history:get('history',[]).filter(x=>x.user_id===u.id)});
    }
    if(path==='/api/admin/overview'){
      const a=get('keys',[]);const active=a.filter(x=>x.status==='ACTIVE'&&new Date(x.expires_at)>new Date()).length;
      const expired=a.filter(x=>x.status==='EXPIRED'||new Date(x.expires_at)<=new Date()).length;
      const orders=get('orders',[]);
      return resp({total_members:a.length,active_members:active,expired_members:expired,pending_orders:orders.filter(x=>x.status==='PENDING').length,recent_members:a.slice(0,8)});
    }
    if(path==='/api/admin/members'){
      return resp({members:get('keys',[])});
    }
    if(path.startsWith('/api/admin/members/') && path.endsWith('/revoke') && method==='POST'){
      const id=path.split('/')[4], a=get('keys',[]), x=a.find(v=>v.id===id);
      if(x){x.status='REVOKED';set('keys',a);addHist('Key','Key dicabut: '+x.access_key_masked,null)}
      return resp({success:true});
    }
    if(path==='/api/admin/keys' && method==='POST'){
      const item=makeKey(b.role,b.duration,'admin');
      addHist('Key','Admin membuat key '+item.role,null);
      return resp({success:true,access_key:item.access_key,key:item.access_key});
    }
    if(path==='/api/admin/orders'){
      return resp({orders:get('orders',[])});
    }
    if(path==='/api/admin/config/deepseek' && method==='PATCH'){
      const st=get('settings',{});st.deepseekApiKey=b.apiKey||'';if(b.base!==undefined)st.deepseekBase=b.base;set('settings',st);
      return resp({success:true});
    }
    if(path==='/api/admin/config/prices' && method==='PATCH'){
      set('prices',{FREE:+b.FREE||0,PRO:+b.PRO||0,VIP:+b.VIP||0});return resp({success:true});
    }
    if(path==='/api/reseller/overview'){
      const me=current(); if(!me||me.role!=='RESELLER')return resp({error:{message:'Akses ditolak'}},401);
      const a=get('keys',[]).filter(x=>x.owner_id===me.id);
      return resp({total_keys:a.length,active_members:a.filter(x=>x.status==='ACTIVE'&&new Date(x.expires_at)>new Date()).length,expired_members:a.filter(x=>x.status==='EXPIRED'||new Date(x.expires_at)<=new Date()).length});
    }
    if(path==='/api/reseller/keys' && method==='POST'){
      const me=current(); if(!me||me.role!=='RESELLER')return resp({error:{message:'Akses ditolak'}},401);
      const item=makeKey(b.role,b.duration,me.id); addHist('Key','Reseller membuat key '+item.role,me.id);
      return resp({success:true,access_key:item.access_key,key:item.access_key});
    }
    if(path==='/api/reseller/members'){
      const me=current(); if(!me||me.role!=='RESELLER')return resp({error:{message:'Akses ditolak'}},401);
      return resp({members:get('keys',[]).filter(x=>x.owner_id===me.id)});
    }
    if(path==='/api/reseller/history'){
      const me=current(); if(!me||me.role!=='RESELLER')return resp({error:{message:'Akses ditolak'}},401);
      return resp({history:get('history',[]).filter(x=>x.user_id===me.id)});
    }
    if(path==='/api/reseller/permissions'){
      return resp({permissions:[
        {name:'CREATE_KEY',label:'Membuat access key'},
        {name:'VIEW_MEMBERS',label:'Melihat member'},
        {name:'VIEW_HISTORY',label:'Melihat riwayat'}
      ]});
    }
    if(path==='/api/ai/chat' && method==='POST'){
      const msg=b.message||'';
      const st=get('settings',{});
      const key=st.deepseekApiKey||'';
      if(key){
        const endpoint=(st.deepseekBase||'https://api.deepseek.com').replace(/\/$/,'')+'/chat/completions';
        return nativeFetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
          body:JSON.stringify({model:st.model||'deepseek-chat',messages:[{role:'user',content:msg}],stream:false})})
          .then(async r=>{const d=await r.json().catch(()=>({})); if(!r.ok)return resp({error:{message:d?.error?.message||'DeepSeek gagal merespons'}},r.status);const answer=d?.choices?.[0]?.message?.content||'Selesai.';addHist('AI',msg,current()?.id);addHist('AI',answer,current()?.id);return resp({answer,content:answer});})
          .catch(()=>resp({answer:localAI(msg),content:localAI(msg)}));
      }
      const answer=localAI(msg);addHist('AI',msg,current()?.id);addHist('AI',answer,current()?.id);return resp({answer,content:answer});
    }
    return nativeFetch(input,opts);
  };
  window.ZAN_LOCAL={get,set,addHist};
})();
}
</script>
</head><body><div class="app"><header class="topbar"><div><div class="brand">Zan<span>AI</span></div><div class="eyebrow">Member</div></div><div class="pill">Reseller</div></header><main class="content"><h1 class="title">Member</h1><p class="sub">Hanya member yang dibuat dari akun kamu.</p><section class="card" style="margin-top:18px"><div class="table"><table><thead><tr><th>Key</th><th>Role</th><th>Status</th><th>Berakhir</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const API=window.ZAN_API_BASE||'';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function out(){fetch(API+'/api/auth/logout',{method:'POST',credentials:'include'}).finally(()=>location.href='reseller-login.html')}</script><script>async function load(){const r=await fetch(API+'/api/reseller/members',{credentials:'include'});if(r.status===401)return location.href='reseller-login.html';const d=await r.json();rows.innerHTML=(d.members||[]).map(x=>'<tr><td>'+esc(x.access_key||x.access_key_masked||'••••')+'</td><td>'+esc(x.role)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.expires_at?new Date(x.expires_at).toLocaleString('id-ID'):'-')+'</td><td><button class="btn" type="button" onclick="copyKey(\"'+esc(x.access_key||'')+'\")">Salin</button></td></tr>').join('')||'<tr><td colspan="5">Belum ada member.</td></tr>'}load()</script><nav class="nav"><a class="active" href="reseller-dashboard.html"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Beranda</span></a><a class="" href="reseller-create.html"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg><span>Buat key</span></a><a class="" href="reseller-members.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M14 14a5 5 0 0 1 7 4"/></svg><span>Member</span></a><a class="" href="reseller-history.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg><span>Riwayat</span></a><a class="" href="reseller-settings.html"><svg class="ico" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 15 .1.1 1.3 1.3-2 2-1.3-1.3-.1-.1a7.8 7.8 0 0 1-2.1.9V21h-3v-3.1a7.8 7.8 0 0 1-2.1-.9l-.1.1-1.3 1.3-2-2 1.3-1.3.1-.1A7.8 7.8 0 0 1 7.3 13H4v-3h3.3a7.8 7.8 0 0 1 .9-2.1l-.1-.1-1.3-1.3 2-2 1.3 1.3.1.1A7.8 7.8 0 0 1 12.3 5V2h3v3a7.8 7.8 0 0 1 2.1.9l.1-.1 1.3-1.3 2 2-1.3 1.3-.1.1a7.8 7.8 0 0 1 .9 2.1H22v3h-3.3a7.8 7.8 0 0 1-.9 2.1Z"/></svg><span>Setelan</span></a></nav></div><script>
function copyKey(value){
 if(!value)return;
 const done=()=>alert('Key berhasil disalin');
 if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(value).then(done).catch(()=>fallbackCopy(value));
 else fallbackCopy(value);
}
function fallbackCopy(value){
 const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';
 document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Key berhasil disalin')}finally{t.remove()}
}
</script><script>
(function(){
 const page=(location.pathname.split('/').pop()||'index.html').toLowerCase();
 document.querySelectorAll('.nav a[href]').forEach(a=>{
  const href=(a.getAttribute('href')||'').split('?')[0].split('#')[0].split('/').pop().toLowerCase();
  a.classList.toggle('active',href===page);
  a.addEventListener('click',()=>document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active')));
 });
})();
</script></body></html>
